thread_pool_size: 5
show_gui: true
version: 1.0.0

meas_models:
  gaussian_models:
    -
      id: sim0
      enable: true
      components: [ POS_X, POS_Y, ROT_Z, LENGTH, WIDTH, HEIGHT]
      gating_prob: 0.99
      fix_orientation:
        enable: true
        weights: [ 0.8, 0.2 ]
      clutter:
        rate: 7
        rate_estimation:
          enable: true
          use_in_filter: false
          prior_mean: 1
          prior_var: 10
      detection:
        prob: 0.8
        prob_min: 0.01
        prob_estimation:
          enable: true
          use_in_filter: false
          prior_mean: 0.5
          prior_var: 0.2
      occlusion:
        model: NO_OCCLUSION
      overwrite_meas_vars: true
      default_values:
        - mean:
            WIDTH: 1
            LENGTH: 1
            HEIGHT: 1
          var:
            POS_X: 0.2
            POS_Y: 0.2
            POS_Z: 0.2
            VEL_X: 0.1
            VEL_Y: 0.1
            ACC_X: 1
            ACC_Y: 1
            VEL_ABS: 3
            ACC_ABS: 1
            ROT_Z: 0.05
            VEL_ROT_Z: 0.15
            WIDTH: 1
            LENGTH: 1
            HEIGHT: 1
    -
      id: sim1
      components: [ POS_X, POS_Y, ROT_Z, LENGTH, WIDTH, HEIGHT ]
      gating_prob: 0.99
      fix_orientation:
        enable: true
        weights: [ 0.8, 0.2 ]
      clutter:
        rate: 7
        rate_estimation:
          enable: true
          use_in_filter: false
          prior_mean: 1
          prior_var: 10
      detection:
        prob: 0.8
        prob_min: 0.01
        prob_estimation:
          enable: true
          use_in_filter: false
          prior_mean: 0.5
          prior_var: 0.2
      occlusion:
        model: NO_OCCLUSION
      overwrite_meas_vars: true
      default_values:
        - mean:
            WIDTH: 1
            LENGTH: 1
            HEIGHT: 1
          var:
            POS_X: 0.2
            POS_Y: 0.2
            POS_Z: 0.2
            VEL_X: 0.1
            VEL_Y: 0.1
            ACC_X: 1
            ACC_Y: 1
            VEL_ABS: 1
            ACC_ABS: 1
            ROT_Z: 0.05
            VEL_ROT_Z: 0.15
            WIDTH: 1
            LENGTH: 1
            HEIGHT: 1
    -
      gating_prob: 0.99
      id: sim3
      enable: true
      components: [ POS_X, POS_Y, ROT_Z, LENGTH, WIDTH, HEIGHT ]
      can_init: false
      clutter:
        rate: 7
        rate_estimation:
          enable: true
          use_in_filter: true
          prior_mean: 1
          prior_var: 10
      detection:
        prob: 0.8
        prob_min: 0.01
        prob_estimation:
          enable: true
          use_in_filter: true
          prior_mean: 0.5
          prior_var: 0.2
      occlusion:
        model: NO_OCCLUSION
      overwrite_meas_vars: true
      default_values:
        - mean:
            WIDTH: 1
            LENGTH: 1
            HEIGHT: 1
          var:
            POS_X: 0.8
            POS_Y: 0.8
            POS_Z: 0.5
            VEL_X: 0.1
            VEL_Y: 0.1
            ACC_X: 1
            ACC_Y: 1
            VEL_ABS: 1
            ACC_ABS: 1
            ROT_Z: 0.05
            VEL_ROT_Z: 0.15
            WIDTH: 1
            LENGTH: 1
            HEIGHT: 1
            X_CC_LOWER_LEFT: 0.01
            X_CC_UPPER_RIGHT: 0.01

state:
  multi_model:
    use_state_models: [4, 2]
    birth_weights:    [0.6, 0.4]
    enable_markov_transition: true
    markov_transition:
      - type: [ CAR_UNION, TRUCK_UNION, BIKE_UNION, UNKNOWN ]
        transition_matrix: "1 0; 1 0"
      - type: [ PEDESTRIAN ]
        transition_matrix: "0 1; 0 1"
  classification:
    use_meas_models:
      - sim0
    classes: [ UNKNOWN, PEDESTRIAN, CAR_UNION, TRUCK_UNION, BIKE_UNION ]
    use_union_classes: true
    discount_factor_prediction: 0.98
  estimation:
    type: BEST_STATE_MODEL
    transform_output_state: true
    output_state_model: 4
    perform_prediction: false

state_models:
  - id: 2
    type: CV
    extent: RECTANGULAR
    assume_orient_in_velocity_direction: true
    distribution:
      type: GAUSSIAN
      mixture: false
      extraction_type: BEST_COMPONENT
      post_process:
        enable: true
        max_components: 10
        merging_distance: 0.0000001
        min_weight: 0.0001
        max_variance: 100000
    model_noise_std_dev:
      ACC_X: 1
      ACC_Y: 1
      VEL_Z: 0.001
      LENGTH_CHANGE: 0.3
      WIDTH_CHANGE: 0.3
      HEIGHT_CHANGE: 0.3
      RADIUS_CHANGE: 0.3
    default_mean:
      POS_X: 0
      POS_Y: 0
      POS_Z: 1
      VEL_X: 0.001
      VEL_Y: 0.001
      VEL_ABS: 0
      ROT_Z: 0.001
      VEL_ROT_Z: 0
      LENGTH: 4
      WIDTH: 2
      HEIGHT: 1
    default_var:
      POS_X: 22500
      POS_Y: 22500
      POS_Z: 0.001
      VEL_X: 25
      VEL_Y: 25
      VEL_ABS: 1
      ROT_Z: 1
      VEL_ROT_Z: 1
      LENGTH: 1
      WIDTH: 1
      HEIGHT: 1
  - id: 4
    type: CTRV
    extent: RECTANGULAR
    distribution:
      type: GAUSSIAN
      mixture: false
      extraction_type: BEST_COMPONENT
      post_process:
        enable: true
        max_components: 10
        merging_distance: 0.0000001
        min_weight: 0.0001
        max_variance: 100000
    model_noise_std_dev:
      VEL_Z: 0.1
      ACC_ABS: 5
      ACC_ROT_Z: 0.5
      WIDTH_CHANGE: 0.3
      LENGTH_CHANGE: 0.3
      HEIGHT_CHANGE: 0.3
    default_mean:
      POS_X: 0
      POS_Y: 0
      POS_Z: 1
      VEL_X: 0.001
      VEL_Y: 0.001
      ROT_Z: 0
      VEL_ABS: 0
      VEL_ROT_Z: 0
      LENGTH: 4
      WIDTH: 2
      HEIGHT: 1.5
    default_var:
      POS_X: 22500
      POS_Y: 22500
      POS_Z: 0.001
      VEL_X: 25
      VEL_Y: 25
      ROT_Z: 1
      VEL_ABS: 1
      VEL_ROT_Z: 1
      LENGTH: 1
      WIDTH: 1
      HEIGHT: 1

birth_model:
  type: STATIC
  allow_overlapping: true
  min_mhd_4_overlapping_wo_extent: 1
  default_birth_existence_prob: 0.1
  dynamic_model:
    mean_num_birth: 2.
    birth_threshold: 0.1
    force_one_step_birth: true
    use_default_values: true
    default_values:
      - var:
          VEL_ABS: 10
          VEL_X: 10
          VEL_Y: 10
          ACC_X: 5
          ACC_Y: 5
  static_model:
    locations:
      - mean:
          POS_X: 0
          POS_Y: 0
          POS_Z: 0
          VEL_X: 0.001
          VEL_Y: 0.001
          VEL_ABS: 0
          ROT_Z: 0.001
          VEL_ROT_Z: 0
          LENGTH: 4
          WIDTH: 2
          HEIGHT: 1
        var:
          POS_X: 30500
          POS_Y: 30500
          POS_Z: 0.001
          VEL_X: 25
          VEL_Y: 25
          VEL_ABS: 1
          ROT_Z: 1
          VEL_ROT_Z: 1
          LENGTH: 1
          WIDTH: 1
          HEIGHT: 1
  roi_model:
    use_sensors_fov_instead: true
    cov_scaling_factor: 1
    confidence_prob: 0.99


persistence_model:
  type: CONSTANT
  constant:
    persistence_prob: 0.99

pmbm_distribution:
  estimation_threshold: 0.4
  ppp:
    birth_weight: 0.5 #0.002
    pruning_threshold: 1e-5
  mbm:
    pruning_threshold_bernoulli: 1e-5
    pruning_threshold_hypotheses: 1e-5
    max_number_hypotheses: 20
    recycle_threshold_bernoulli: 1e-2
    enable_recycling: false
    assignment_method: MURTY #GIBBS_SAMPLING #MURTY
    enable_projection: true #PMB

filter:
  type: PMBM_IC
  enable: true