thread_pool_size: 0
show_gui: false
version: 1.0.0
sort_measurement_containers: true
ground_truth_metrics:
  ospa:
    evaluate: true
    c: 10
    p: 2
  ospa2:
    evaluate: true
    c: 10
    p: 2
    sliding_window_length_ms: 20000
  gospa:
    evaluate: true
    c: 10
    p: 2

#### Persistence #######################################################################################################
persistence_model:
  type: CONSTANT
  constant:
    persistence_prob: 0.98

#### StateDistributions
state:
  multi_model:
    use_state_models: [0]
    birth_weights:    [1]
  classification:
    use_meas_models:
      - sim1
    classes: [UNKNOWN, PEDESTRIAN, CAR_UNION, TRUCK_UNION, BIKE_UNION]
    use_union_classes: true
    discount_factor_prediction: 0.98
  estimation:
    type: BEST_STATE_MODEL
    transform_output_state: false
    output_state_model: 0

#### StateModels #######################################################################################################
state_models:
  -
    id: 0
    type: CV
    distribution:
      type: GAUSSIAN
      mixture: true
      extraction_type: BEST_COMPONENT
      post_process:
        enable: true
        max_components: 10
        merging_distance: 0.0000001
        min_weight: 0.001
        max_variance: 1000
    extent: NONE
    model_noise_std_dev:
      ACC_X: 0.2
      ACC_Y: 0.2
      VEL_Z: 0.001
      WIDTH_CHANGE: 0.001
      LENGTH_CHANGE: 0.001
      HEIGHT_CHANGE: 0.001

self_assessment:
  enable: false

#### Birth #############################################################################################################
birth_model:
  type: STATIC
  allow_overlapping: true
  min_mhd_4_overlapping_wo_extent: 1
  default_birth_existence_prob: 0.05
  dynamic_model:
    mean_num_birth: 2.
    birth_threshold: 0.1
    force_one_step_birth: true
    use_default_values: true
    default_values:
      - type: [ UNKNOWN, CAR_UNION, TRUCK_UNION, BIKE_UNION ]
        var:
          VEL_ABS: 2
          VEL_X: 2
          VEL_Y: 2
      - type: [ PEDESTRIAN ]
        var:
          VEL_ABS: 1
          VEL_X: 1
          VEL_Y: 1
  static_model:
    locations:
      - mean:
          POS_X: -400
          POS_Y: 400
          POS_Z: 0
          VEL_X: 0
          VEL_Y: 0
        var:
          POS_X: 225
          POS_Y: 225
          POS_Z: 0.001
          VEL_X: 25
          VEL_Y: 25
      - mean:
          POS_X: -400
          POS_Y: 0
          POS_Z: 0
          VEL_X: 0
          VEL_Y: 0
      - mean:
          POS_X: -400
          POS_Y: -400
          POS_Z: 0
          VEL_X: 0
          VEL_Y: 0
      - mean:
          POS_X: 400
          POS_Y: -400
          POS_Z: 0
          VEL_X: 0
          VEL_Y: 0
      - mean:
          POS_X: 400
          POS_Y: 0
          POS_Z: 0
          VEL_X: 0
          VEL_Y: 0
      - mean:
          POS_X: 400
          POS_Y: 400
          POS_Z: 0
          VEL_X: 0
          VEL_Y: 0


meas_models:
  gaussian_models:
    -
      id: sim0
      components: [POS_X,POS_Y]
      can_init: true
      gating_prob: 0.99
      fix_orientation:
        enable: false
        weights: [ 0.8, 0.2 ]
      clutter:
        rate: 7
        rate_estimation:
          enable: false
          use_in_filter: false
      detection:
        prob: 0.67
        prob_min: 0.01
        prob_estimation:
          enable: false
          use_in_filter: false
      occlusion:
        model: NO_OCCLUSION
      overwrite_meas_vars: false
      default_values:
        - mean:
            WIDTH: 1
            LENGTH: 1
            HEIGHT: 1
          var:
            POS_X: 2
            POS_Y: 2
            POS_Z: 0.5
            ROT_Z: 0.1
            VEL_ROT_Z: 0.3
            WIDTH: 1
            LENGTH: 1
            HEIGHT: 1

    -
      id: sim1
      components: [POS_X,POS_Y]
      can_init: true
      gating_prob: 0.99
      fix_orientation:
        enable: false
        weights: [ 0.8, 0.2 ]
      clutter:
        rate: 7
        rate_estimation:
          enable: false
          use_in_filter: false
      detection:
        prob: 0.67
        prob_min: 0.01
        prob_estimation:
          enable: false
          use_in_filter: false
      occlusion:
        model: NO_OCCLUSION
      overwrite_meas_vars: false
      default_values:
        - mean:
            WIDTH: 1
            LENGTH: 1
            HEIGHT: 1
          var:
            POS_X: 2
            POS_Y: 2
            POS_Z: 0.5
            ROT_Z: 0.1
            VEL_ROT_Z: 0.3
            WIDTH: 1
            LENGTH: 1
            HEIGHT: 1

    -
      id: sim2
      components: [POS_X,POS_Y]
      can_init: true
      gating_prob: 0.99
      fix_orientation:
        enable: false
        weights: [ 0.8, 0.2 ]
      clutter:
        rate: 7
        rate_estimation:
          enable: false
          use_in_filter: false
      detection:
        prob: 0.67
        prob_min: 0.01
        prob_estimation:
          enable: false
          use_in_filter: false
      occlusion:
        model: NO_OCCLUSION
      overwrite_meas_vars: false
      default_values:
        - mean:
            WIDTH: 1
            LENGTH: 1
            HEIGHT: 1
          var:
            POS_X: 2
            POS_Y: 2
            POS_Z: 0.5
            ROT_Z: 0.1
            VEL_ROT_Z: 0.3
            WIDTH: 1
            LENGTH: 1
            HEIGHT: 1


lmb_distribution:
  update_method: GLMB
  post_process_prediction:
    enable: false
    max_tracks: 1000          # only keep max_tracks
    pruning_threshold: 1e-2   # only keep tracks with existence probability higher of
    max_last_assoc_duration_ms: 1200   # remove all tracks, with greater last associated measurement durationn
  post_process_update:
    enable: true
    max_tracks: 1000000000
    pruning_threshold: 0.001
  multi_sensor:
    method: PU
    pu:
      use_best_component: true
      num_components: 15
  extraction:
    type: EXISTENCE_PROBABILITY
    threshold: 0.5


glmb_distribution:
  do_profiling: false
  post_process_prediction:
    enable: false
  post_process_update:
    enable: false
    method: DISSERTATION_HERRMANN
    standard_pp:
      pruning_threshold: 0.0001
      max_hypotheses: 1000
      max_states_per_label: 10000000
      limit_states_per_label: false
    diss_herrmann_pp:
      pruning_max_comps_retain: 0
      pruning_min_comps_per_card: 10
      pruning_min_comps_per_card_thresh: 1e-18
      pruning_max_weight_ratio: 1e+18
      pruning_alloc_min_comps_per_card_by_poisson: true
  update:
    joint_prediction_and_update: false
    assignment_method: MURTY
    max_total_number_update_hypotheses: 1000
    num_update_hypotheses:
      equal_allocation_share_ratio: 0.5
      max_update_hypotheses: 1000
    gibbs_sampling:
      max_trials_factor: 1000
      abort_after_ntimes_no_new_sol: 100

#### Filter ############################################################################################################
filter:
  type: LMB_MS
  enable: true