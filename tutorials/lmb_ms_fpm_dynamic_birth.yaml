thread_pool_size: 20
show_gui: true
version: 1.0.0
ground_truth_metrics:
  ospa:
    evaluate: true
    c: 10
    p: 2
  ospa2:
    evaluate: true
    c: 10
    p: 2
    sliding_window_length_ms: 1000
  gospa:
    evaluate: true
    c: 10
    p: 2

##### Measurement Models ###############################################################################################
meas_models:
  gaussian_models:
    -
      id: sim0
      components: [ POS_X, POS_Y ]
      can_init: true
      gating_prob: 0.999
      fix_orientation:
        enable: false
        weights: [ 0.8, 0.2 ]
      clutter:
        rate: 7
        rate_estimation:
          enable: true
          use_in_filter: false
      detection:
        prob: 0.8
        prob_min: 0.01
        prob_estimation:
          enable: true
          use_in_filter: false
      occlusion:
        model: NO_OCCLUSION
      overwrite_meas_vars: false
      default_values:
        - mean:
            WIDTH: 1
            LENGTH: 1
            HEIGHT: 1
          var:
            POS_X: 2
            POS_Y: 2
            POS_Z: 0.5
            ROT_Z: 0.1
            VEL_ROT_Z: 0.3
            WIDTH: 1
            LENGTH: 1
            HEIGHT: 1

    -
      id: sim1
      components: [ POS_X, POS_Y ]
      can_init: true
      gating_prob: 0.999
      fix_orientation:
        enable: false
        weights: [ 0.8, 0.2 ]
      clutter:
        rate: 7
        rate_estimation:
          enable: true
          use_in_filter: false
      detection:
        prob: 0.8
        prob_min: 0.01
        prob_estimation:
          enable: true
          use_in_filter: false
      occlusion:
        model: NO_OCCLUSION
      overwrite_meas_vars: false
      default_values:
        - mean:
            WIDTH: 1
            LENGTH: 1
            HEIGHT: 1
          var:
            POS_X: 2
            POS_Y: 2
            POS_Z: 0.5
            ROT_Z: 0.1
            VEL_ROT_Z: 0.3
            WIDTH: 1
            LENGTH: 1
            HEIGHT: 1
    -
      id: sim2
      components: [ POS_X, POS_Y ]
      can_init: true
      gating_prob: 0.99999
      fix_orientation:
        enable: false
        weights: [ 0.8, 0.2 ]
      clutter:
        rate: 7
        rate_estimation:
          enable: true
          use_in_filter: false
      detection:
        prob: 0.8
        prob_min: 0.01
        prob_estimation:
          enable: true
          use_in_filter: false
      occlusion:
        model: NO_OCCLUSION
      overwrite_meas_vars: false
      default_values:
        - mean:
            WIDTH: 1
            LENGTH: 1
            HEIGHT: 1
          var:
            POS_X: 2
            POS_Y: 2
            POS_Z: 0.5
            ROT_Z: 0.1
            VEL_ROT_Z: 0.3
            WIDTH: 1
            LENGTH: 1
            HEIGHT: 1

#### StateDistributions
state:
  multi_model:
    use_state_models: [0]
    birth_weights:    [1]
    enable_markov_transition: false
    markov_transition:
      - type: [CAR_UNION, TRUCK_UNION, BIKE_UNION, PEDESTRIAN, UNKNOWN]
        transition_matrix: "0.99 0.01; 0.01 0.99"
  classification:
    use_meas_models:
      - sim0
    classes: [UNKNOWN, PEDESTRIAN, CAR, TRUCK, BICYCLE]
    use_union_classes: true
    discount_factor_prediction: 0.98
  estimation:
    type: BEST_STATE_MODEL
    transform_output_state: false
    output_state_model: 0



#### StateModels #######################################################################################################
state_models:
  - id: 0
    type: CV
    distribution:
      type: GAUSSIAN
      mixture: true
      extraction_type: BEST_COMPONENT
      post_process:
        enable: true
        max_components: 10
        merging_distance: 0.0000001
        min_weight: 0.001
        max_variance: 1000
    extent: NONE
    model_noise_std_dev:
      ACC_X: 0.2
      ACC_Y: 0.2
      VEL_Z: 0.001
      WIDTH_CHANGE: 0.001
      LENGTH_CHANGE: 0.001
      HEIGHT_CHANGE: 0.001



#### Birth #############################################################################################################
birth_model:
  type: DYNAMIC
  allow_overlapping: true
  min_mhd_4_overlapping_wo_extent: 1
  default_birth_existence_prob: 0.01
  dynamic_model:
    mean_num_birth: 2.
    birth_threshold: 0.1
    force_one_step_birth: true
    use_default_values: true
    default_values:
      - var:
          VEL_X: 25
          VEL_Y: 25


#### Persistence #######################################################################################################
persistence_model:
  type: CONSTANT
  constant:
    persistence_prob: 0.99


lmb_distribution:
  update_method: LBP
  post_process_prediction:
    enable: false
    max_tracks: 10000          # only keep max_tracks
    pruning_threshold: 1e-2   # only keep tracks with existence probability higher of
    max_last_assoc_duration_ms: 1200   # remove all tracks, with greater last associated measurement durationn
  post_process_update:
    enable: true
    max_tracks: 1000000000
    pruning_threshold: 1e-3
  multi_sensor:
    method: FPM
    fpm:
      num_components: 20
  extraction:
    type: EXISTENCE_PROBABILITY
    threshold: 0.5

self_assessment:
  enable: true
  track_assessment:
    window_length_ms: 500
  clutter_rate_estimation:
    enable: true
  detection_prob_estimation:
    enable: true
  persistence_prob_estimation:
    enable: true
    prior_mean: 0.95
    prior_var: 0.04
    window_length_ms: 900
  bayes_factor:
    num_updates: 1
    detection:
      enable: false
      comparison:
        - mean: 0.5
          var: 0.03

#### Filter ############################################################################################################
filter:
  type: LMB_MS
  enable: true
