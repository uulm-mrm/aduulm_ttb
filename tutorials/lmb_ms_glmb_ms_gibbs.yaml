thread_pool_size: 20
show_gui: true
version: 1.0.0
ground_truth_metrics:
  ospa:
    evaluate: true
    c: 10
    p: 2
  ospa2:
    evaluate: true
    c: 10
    p: 2
    sliding_window_length_ms: 1000
  gospa:
    evaluate: true
    c: 10
    p: 2

##### Measurement Models ###############################################################################################
meas_models:
  gaussian_models:
    -
      id: sim0
      components: [ POS_X, POS_Y, LENGTH, WIDTH, ROT_Z ]
      can_init: true
      gating_prob: 0.99999
      fix_orientation:
        enable: true
        weights: [ 0.8, 0.2 ]
      clutter:
        rate: 7
        rate_estimation:
          enable: true
          use_in_filter: false
      detection:
        prob: 0.8
        prob_min: 0.01
        prob_estimation:
          enable: true
          use_in_filter: false
      occlusion:
        model: NO_OCCLUSION
      default_values:
        - mean:
            WIDTH: 1
            LENGTH: 1
            HEIGHT: 1
          var:
            POS_X: 2
            POS_Y: 2
            POS_Z: 0.5
            ROT_Z: 0.1
            VEL_ROT_Z: 0.3
    - id: sim1
      components: [ POS_X, POS_Y, LENGTH, WIDTH, ROT_Z ]
      can_init: true
      gating_prob: 0.99999
      fix_orientation:
        enable: true
        weights: [ 0.8, 0.2 ]
      clutter:
        rate: 7
        rate_estimation:
          enable: true
          use_in_filter: false
      detection:
        prob: 0.8
        prob_min: 0.01
        prob_estimation:
          enable: true
          use_in_filter: false
      occlusion:
        model: NO_OCCLUSION
      default_values:
        - mean:
            WIDTH: 1
            LENGTH: 1
            HEIGHT: 1
          var:
            POS_X: 2
            POS_Y: 2
            POS_Z: 0.5
            ROT_Z: 0.1
            VEL_ROT_Z: 0.3




#### StateDistributions
state:
  multi_model:
    use_state_models: [0]
    birth_weights:    [1]
    enable_markov_transition: false
    markov_transition:
      - type: [CAR_UNION, TRUCK_UNION, BIKE_UNION, PEDESTRIAN, UNKNOWN]
        transition_matrix: "1"
  classification:
    use_meas_models:
      - sim0
    classes: [UNKNOWN, PEDESTRIAN, CAR_UNION, TRUCK_UNION, BIKE_UNION]
    use_union_classes: true
    discount_factor_prediction: 0.98
  estimation:
    type: BEST_STATE_MODEL
    transform_output_state: false
    output_state_model: 0



#### StateModels #######################################################################################################
state_models:
  - id: 0
    type: CV
    distribution:
      type: GAUSSIAN
      mixture: true
      extraction_type: BEST_COMPONENT
      post_process:
        enable: true
        max_components: 10
        merging_distance: 0.1
        min_weight: 0.001
        max_variance: 1000
    extent: NONE
    model_noise_std_dev:
      ACC_X: 0.2
      ACC_Y: 0.2
      VEL_Z: 0.001
      WIDTH_CHANGE: 0.001
      LENGTH_CHANGE: 0.001
      HEIGHT_CHANGE: 0.001
  -
    id: 4
    type: CTRV
    extent: RECTANGULAR
    distribution:
      type: GAUSSIAN
      mixture: false
      post_process:
        enable: false
    model_noise_std_dev:
      VEL_Z: 0.1
      ACC_ABS: 5
      ACC_ROT_Z: 0.5
      WIDTH_CHANGE: 0.3
      LENGTH_CHANGE: 0.3
      HEIGHT_CHANGE: 0.3
    default_mean:
      VEL_ABS: 0
      VEL_ROT_Z: 0
    default_var:
      VEL_ABS: 1
      VEL_ROT_Z: 1

birth_model:
  type: DYNAMIC
  allow_overlapping: true
  min_mhd_4_overlapping_wo_extent: 1
  default_birth_existence_prob: 0.1
  dynamic_model:
    mean_num_birth: 2.
    birth_threshold: 0.1
    force_one_step_birth: true
    use_default_values: true
    default_values:
      - var:
          VEL_X: 25
          VEL_Y: 25
  static_model:
    locations:
      - mean:
          POS_X: -400
          POS_Y: 400
          POS_Z: 0
          VEL_X: 0
          VEL_Y: 0
        var:
          POS_X: 100
          POS_Y: 100
          POS_Z: 0.001
          VEL_X: 25
          VEL_Y: 25
      - mean:
          POS_X: -400
          POS_Y: 0
          POS_Z: 0
          VEL_X: 0
          VEL_Y: 0
      - mean:
          POS_X: -400
          POS_Y: -400
          POS_Z: 0
          VEL_X: 0
          VEL_Y: 0
      - mean:
          POS_X: 400
          POS_Y: -400
          POS_Z: 0
          VEL_X: 0
          VEL_Y: 0
      - mean:
          POS_X: 400
          POS_Y: 0
          POS_Z: 0
          VEL_X: 0
          VEL_Y: 0
      - mean:
          POS_X: 400
          POS_Y: 400
          POS_Z: 0
          VEL_X: 0
          VEL_Y: 0

persistence_model:
  type: CONSTANT
  constant:
    persistence_prob: 0.9

lmb_distribution:
  update_method: GLMB
  post_process_prediction:
    enable: true
    max_tracks: 1000          # only keep max_tracks
    pruning_threshold: 1e-2   # only keep tracks with existence probability higher of
    max_last_assoc_duration_ms: 1200   # remove all tracks, with greater last associated measurement durationn
  post_process_update:
    enable: true
    max_tracks: 1000000000
    pruning_threshold: 1e-2
  multi_sensor:
    method: GLMB
  extraction:
    type: EXISTENCE_PROBABILITY
    threshold: 0.5

glmb_distribution:
  do_profiling: false
  use_grouping: true
  post_process_prediction:
    enable: false
    pruning_threshold: 1e-10
    max_hypotheses: 1000
  post_process_update:
    enable: true
    method: STANDARD
    standard_pp:
      pruning_threshold: 1e-10
      max_hypotheses: 1000
  update:
    joint_prediction_and_update: true
    assignment_method: GIBBS_SAMPLING
    max_total_number_update_hypotheses: 1000
    num_update_hypotheses:
      equal_allocation_share_ratio: 0.2
      max_update_hypotheses: 1000
    gibbs_sampling:
      max_trials_factor: 500
      abort_after_ntimes_no_new_sol: 100
  multi_sensor:
    method: MS

self_assessment:
  enable: true
  track_assessment:
    window_length_ms: 500
  clutter_rate_estimation:
    enable: true
  detection_prob_estimation:
    enable: true
  persistence_prob_estimation:
    enable: true
    prior_mean: 0.95
    prior_var: 0.04
    window_length_ms: 900
  bayes_factor:
    num_updates: 1
    detection:
      enable: false
      comparison:
        - mean: 0.5
          var: 0.03

filter:
  type: LMB_MS
  enable: true

